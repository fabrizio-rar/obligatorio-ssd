[project]
name = "mercanova-backend"
version = "0.1.0"
description = "MercaNova AI Shopping Assistant - backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Ingest: read the Excel dataset (pandas uses openpyxl for .xlsx)
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28", # required by FastAPI's TestClient
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a real Postgres (TEST_DATABASE_URL)",
]
