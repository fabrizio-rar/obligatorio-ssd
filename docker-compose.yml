services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Exposed on localhost only, for DB clients (DBeaver, psql)
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # entrypoint.sh: alembic upgrade head -> ingest --if-empty -> uvicorn
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./reports:/app/reports

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # Vite proxies /api to the backend service (the browser only talks to :5173)
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      # hot reload: edit src/, index.html and public/ on the host; node_modules stays inside the container
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public

volumes:
  pgdata: {}
